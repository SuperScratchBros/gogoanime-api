<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050806"><title>NLGEP Entertainment</title>
<style>
:root{--g:#02ff00;--bg:#050806;--panel:#0b150e;--line:#25412b;--muted:#9aab9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#12351b 0,transparent 48%),var(--bg);color:#f3fff3;font:15px/1.5 Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;backdrop-filter:blur(18px);background:#050806ed;border-bottom:1px solid var(--line);padding:14px clamp(14px,4vw,54px);display:flex;align-items:center;gap:20px}.brand{font-weight:900;letter-spacing:1px;white-space:nowrap}.brand span{color:var(--g);text-shadow:0 0 15px #02ff0066}.search{display:flex;flex:1;max-width:760px;margin:auto;background:#0d150f;border:1px solid #24402a;border-radius:13px;overflow:hidden}.search input{min-width:0;flex:1;background:transparent;border:0;padding:13px 15px;color:white;outline:none}.search button,.primary{background:var(--g);color:#031003;border:0;font-weight:800;padding:0 19px}.state{font-size:12px;color:var(--muted);white-space:nowrap}.state:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:7px}.wrap{max-width:1440px;margin:auto;padding:28px clamp(14px,4vw,54px) 70px}.hero{padding:34px clamp(18px,4vw,48px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(115deg,#0e2013ed,#07100be8 60%,#0c1b11);box-shadow:0 18px 70px #0006;position:relative;overflow:hidden}.eyebrow{color:var(--g);font-weight:800;letter-spacing:3px;font-size:11px}.hero h1{font-size:clamp(30px,5vw,58px);line-height:1.04;margin:12px 0;max-width:700px}.hero p{color:#b8c9bb;max-width:600px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0}.tab,.chip{border:1px solid #29422e;background:#0b130d;color:#cfe2d1;padding:9px 15px;border-radius:999px}.tab.active,.chip.active{border-color:var(--g);color:var(--g);background:#0b200d}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 15px}.head h2{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:17px}.item{min-width:0;border:1px solid #203425;border-radius:15px;background:var(--panel);overflow:hidden;cursor:pointer;transition:.18s}.item:hover{transform:translateY(-4px);border-color:var(--g)}.poster{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:linear-gradient(145deg,#14291a,#09100b)}.info{padding:11px}.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:4px}.empty,.loading{padding:28px;text-align:center;border:1px dashed #2a4230;border-radius:15px;color:var(--muted);grid-column:1/-1}.modal{position:fixed;inset:0;z-index:30;background:#000c;display:none;overflow:auto;padding:22px}.modal.open{display:block}.detail{max-width:1050px;margin:30px auto;background:#07100a;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 25px 100px #000}.detailtop{display:grid;grid-template-columns:200px 1fr;gap:24px;padding:24px}.detailtop img{width:100%;border-radius:12px;max-height:290px;object-fit:cover}.detail h2{margin:0 0 8px;font-size:28px}.close{float:right;background:#152219;color:white;border:1px solid #38533c;border-radius:9px;padding:7px 12px}.episodes{padding:0 24px 25px}.episode-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:280px;overflow:auto}.episode{border:1px solid #2a4430;background:#0c180f;color:#eaffea;border-radius:9px;padding:10px;text-align:left}.episode:hover{border-color:var(--g)}.player{padding:20px;border-top:1px solid #1e3222}.player video{width:100%;max-height:65vh;background:#000;border-radius:12px}.player iframe{width:100%;height:min(65vh,580px);border:0;background:#000;border-radius:12px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}.player select{background:#101d13;color:white;border:1px solid #35513a;border-radius:8px;padding:9px}.foot{color:#708273;font-size:12px;text-align:center;margin-top:45px}@media(max-width:650px){.top{flex-wrap:wrap;gap:10px}.brand{font-size:14px}.state{margin-left:auto}.search{order:3;flex-basis:100%;max-width:none}.hero{padding:25px 20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detailtop{grid-template-columns:100px 1fr;padding:15px;gap:14px}.detail h2{font-size:20px}.episodes{padding:0 15px 18px}.modal{padding:8px}.detail{margin:8px auto}}
</style></head>
<body>
<header class="top"><div class="brand">NLGEP <span>ENTERTAINMENT</span></div><form id="searchForm" class="search"><input id="query" placeholder="Search anime titles..." autocomplete="off" aria-label="Search titles"><button class="primary">Search</button></form><div class="state" id="apiState">Connecting</div></header>
<main class="wrap"><section class="hero"><div class="eyebrow">YOUR NEXT WATCH STARTS HERE</div><h1>Entertain your<br><span style="color:var(--g)">infinite side.</span></h1><p>Discover anime, find your next series, and open episodes in one place.</p><div class="tabs"><button class="tab active" data-mode="popular">Popular</button><button class="tab" data-mode="recent-release">Recent Episodes</button><button class="tab" data-mode="top-airing">Top Airing</button><button class="tab" data-mode="anime-movies">Anime Movies</button></div></section><div class="head"><h2 id="sectionTitle">Popular Anime</h2><span class="sub" id="resultCount"></span></div><section id="results" class="grid"><div class="loading">Loading titles…</div></section><div class="foot">NLGEP Entertainment · Media discovery interface<br>Only stream content you have permission to access.</div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="detail" id="detail"></div></div>
<script>
const API=location.protocol==='file:'?'https://nlgep-gogoanime-api.onrender.com':location.origin;const $=s=>document.querySelector(s);let mode='popular';const labels={'popular':'Popular Anime','recent-release':'Recent Episodes','top-airing':'Top Airing','anime-movies':'Anime Movies','search':'Search Results'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const image=x=>x.animeImg||x.image||'';const idOf=x=>x.animeId||x.id||x.episodeId||'';const nameOf=x=>x.animeTitle||x.title||x.name||'Untitled';
async function api(path){const r=await fetch(API+path);if(!r.ok)throw Error('API returned '+r.status);return r.json()}
async function load(path='/'+mode,label=labels[mode]||'Results'){$('#sectionTitle').textContent=label;$('#results').innerHTML='<div class="loading">Loading titles…</div>';$('#resultCount').textContent='';try{let data=await api(path);if(!Array.isArray(data))data=data.results||data.data||[];render(data);$('#apiState').textContent='API online'}catch(e){$('#results').innerHTML='<div class="empty">Could not load titles. The backend may be waking up or its source may be unavailable.<br><br>'+esc(e.message)+'<br><br><button class="chip" onclick="load()">Try again</button></div>';$('#apiState').textContent='API unavailable'}}
function render(items){$('#resultCount').textContent=items.length+' titles';if(!items.length){$('#results').innerHTML='<div class="empty">No titles found. Try another search.</div>';return}$('#results').innerHTML=items.map((x,i)=>'<article class="item" data-i="'+i+'"><img class="poster" loading="lazy" src="'+esc(image(x))+'" onerror="this.style.opacity=0" alt=""><div class="info"><div class="name" title="'+esc(nameOf(x))+'">'+esc(nameOf(x))+'</div><div class="meta">'+esc(x.releasedDate||x.status||(x.episodeNum&&'Episode '+x.episodeNum)||x.latestEp||'Anime')+'</div></div></article>').join('');$('#results').querySelectorAll('.item').forEach((el,i)=>el.addEventListener('click',()=>openTitle(items[i])))}
async function openTitle(item){const id=idOf(item);if(!id)return;$('#modal').classList.add('open');$('#detail').innerHTML='<div class="loading">Loading details…</div>';try{const d=await api('/anime-details/'+encodeURIComponent(id));const eps=d.episodesList||d.episodes||[];$('#detail').innerHTML='<div class="detailtop"><img src="'+esc(d.animeImg||image(item))+'" onerror="this.style.display=\'none\'" alt=""><div><button class="close" id="close">Close ✕</button><div class="eyebrow">'+esc(d.type||'ANIME')+'</div><h2>'+esc(d.animeTitle||nameOf(item))+'</h2><div class="meta">'+esc(d.releasedDate||'')+' · '+esc(d.status||'')+' · '+esc(d.episodesAvaliable||eps.length||'')+' episodes</div><p>'+esc(d.synopsis||'No synopsis available.')+'</p><p class="sub">'+esc((d.genres||[]).join(' · '))+'</p></div></div><div class="episodes"><div class="head"><h2>Episodes</h2><span class="sub">'+eps.length+' available</span></div><div class="episode-list">'+(eps.length?eps.map((e,i)=>'<button class="episode" data-ep="'+i+'">Episode '+esc(e.episodeNum||i+1)+'</button>').join(''):'<div class="empty">No episodes returned.</div>')+'</div></div><div class="player" id="player"><div class="sub">Choose an episode to load playback sources.</div></div>';$('#close').onclick=closeModal;$('#detail').querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>playEpisode(eps[+b.dataset.ep]))}catch(e){$('#detail').innerHTML='<button class="close" onclick="closeModal()">Close ✕</button><div class="empty">Could not load details: '+esc(e.message)+'</div>'}}
async function playEpisode(ep){const id=ep.episodeId||ep.id;if(!id)return;const p=$('#player');p.innerHTML='<div class="loading">Finding playback sources…</div>';const sources=[];for(const route of ['/vidcdn/watch/','/streamsb/watch/']){try{const d=await api(route+encodeURIComponent(id));(d.data||d.sources||[]).forEach(s=>{const url=s.file||s.url||s.src;if(url)sources.push({url,label:String(s.label||s.quality||route.split('/')[1]),type:s.type||''})})}catch{}}if(!sources.length){p.innerHTML='<div class="empty">No playable source returned. Try another episode or try again later.</div>';return}p.innerHTML='<div class="head"><h2>Now Playing</h2><span class="sub">'+esc(ep.episodeNum?'Episode '+ep.episodeNum:'Selected episode')+'</span></div><div class="tools"><label for="source">Source / quality</label><select id="source">'+sources.map((s,i)=>'<option value="'+i+'">'+esc(s.label||'Source '+(i+1))+'</option>').join('')+'</select><a id="openSource" class="chip" target="_blank" rel="noopener noreferrer" href="'+esc(sources[0].url)+'">Open source ↗</a></div><div id="videoArea"></div><p class="sub">If playback is blocked by the provider or browser, open the source or try another one.</p>';const sel=$('#source');function mount(){const s=sources[+sel.value];$('#openSource').href=s.url;const area=$('#videoArea');if(/\.mp4($|\?)/i.test(s.url)||/\.m3u8($|\?)/i.test(s.url)){area.innerHTML='<video controls playsinline></video>';area.querySelector('video').src=s.url}else area.innerHTML='<iframe referrerpolicy="no-referrer" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen src="'+esc(s.url)+'"></iframe>'}sel.onchange=mount;mount()}
function closeModal(){$('#modal').classList.remove('open');$('#detail').innerHTML=''}$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#query').value.trim();if(!q)return;document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));mode='search';load('/search?keyw='+encodeURIComponent(q),'Search: '+q)});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;load()}));load('/popular','Popular Anime');
</script></body></html>
